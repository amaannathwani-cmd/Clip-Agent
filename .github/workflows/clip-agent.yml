name: Clip Agent

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours (YouTube's free quota allows about 6 uploads a day)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Make the video but don't post it"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: clip-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
          restore-keys: whisper-
      - name: Run agent
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m clip_agent.main --dry-run
          else
            python -m clip_agent.main
          fi
      - name: Save the list of posted clips
        if: always()
        run: |
          git config user.name "clip-agent"
          git config user.email "clip-agent@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "Record posted clips" && git push)
      - name: Keep the videos for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: out/*.mp4
          retention-days: 3
          if-no-files-found: ignore
